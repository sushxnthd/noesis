name: NOESIS Run351 frozen replication
on:
  push:
    branches:
      - research/kernel-001-run351-bias18-transfer
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy sympy
      - run: python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python research/run348/train348.py
      - run: python research/run351/reproduce.py
      - run: python research/run351/verify_exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run351-reproduction
          path: |
            research/run348/trajectories348.json
            research/run351/outcomes.json
            research/run351/exact_outcomes.json
