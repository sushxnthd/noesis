name: NOESIS Run351 frozen replication
on:
  push:
    branches:
      - research/kernel-001-run351-bias18-transfer
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy sympy pytest
      - uses: actions/download-artifact@v4
        with:
          name: run351-reproduction
          run-id: 39820568214
          repository: sushxnthd/noesis
          github-token: ${{ github.token }}
          path: research
      - run: python research/run351/reproduce.py
      - run: python research/run351/verify_exact.py
      - run: python -m pytest -q research/run351/test_run351.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run351-frozen-reverification
          path: |
            research/run351/outcomes.json
            research/run351/exact_outcomes.json
