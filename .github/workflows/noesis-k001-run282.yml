name: NOESIS K001 Run282 exact neutral-acquisition reproduction
on:
  push:
    branches:
      - research/kernel-001-run282-exact-quotient-heldout
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Train 192 matched networks and independently verify
        working-directory: research/kernel001/run282
        run: |
          python train.py | tee train.log
          python verify.py | tee verify.log
      - name: Preserve raw training and proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noesis-run282-raw-checkpoints-and-verification
          path: |
            research/kernel001/run282/checkpoints282.json
            research/kernel001/run282/optimizer282.pt
            research/kernel001/run282/verification282.json
            research/kernel001/run282/train.log
            research/kernel001/run282/verify.log
          retention-days: 90
