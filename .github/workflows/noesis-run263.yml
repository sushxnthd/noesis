name: NOESIS Run263 exact certificates
on:
  push:
    branches:
      - research/kernel-001-run263-asymmetric-prospective
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify seven trained checkpoints with exact rational invariants and first failures
        run: python research/run263/ci_verify.py
