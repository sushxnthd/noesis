name: NOESIS Run 196 proof
on:
  push:
    branches: [research/kernel-001-run196-task-aligned-cert-transfer]
    paths: ['runs/run196/**', '.github/workflows/noesis-run196.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 mpmath==1.3.0
      - run: OPENBLAS_NUM_THREADS=1 python runs/run196/synthesize_and_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noesis-run196-certificates
          path: runs/run196/CERT_233_*.json
