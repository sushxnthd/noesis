name: noesis-run213-train
on:
  push:
    branches: [research/kernel-001-run213-2d-prospective-retention]
    paths: [research/run213/train_minimal.py, .github/workflows/noesis-run213-train.yml]
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: cd research/run213 && python train_minimal.py && sha256sum RUN213_CHECKPOINTS.json
      - uses: actions/upload-artifact@v4
        with:
          name: run213-trained-checkpoints
          path: research/run213/RUN213_CHECKPOINTS.json
