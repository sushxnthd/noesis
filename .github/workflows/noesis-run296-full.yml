name: NOESIS Run296 public reproduction
on:
  push:
    branches: [research/kernel-001-run296-reachable-silent-quotient]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy==1.17.0
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python research/kernel_001/run294/train291.py
      - run: python research/kernel_001/run296/evaluate296.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python research/kernel_001/run296/independent296_public.py
      - run: python research/kernel_001/run296/test_reachability296.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noesis-run296-public-evidence
          path: |
            research/kernel_001/run294/checkpoints291.json
            research/kernel_001/run296/rows296_public.json
            research/kernel_001/run296/results296_public.json
