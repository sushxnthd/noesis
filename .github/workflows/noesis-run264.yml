name: NOESIS Run264 exact proof
on:
  push:
    branches:
      - research/kernel-001-run264-transition-prediction
  pull_request:
    paths:
      - 'research/run264/**'
      - '.github/workflows/noesis-run264.yml'
jobs:
  exact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/run264/verify_frozen_transition.py
