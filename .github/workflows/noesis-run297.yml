name: NOESIS Run297
on:
  push:
    branches: [research/kernel-001-run297-latch-transfer]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Reproduce all frozen evidence
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python research/kernel_001/run297/reproduce297.py
      - name: Independent exact checks
        run: python research/kernel_001/run297/independent297.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noesis-run297-evidence
          path: research/kernel_001/run297/*.json
