name: NOESIS Run 190 research reproduction
on:
  push:
    branches: [research/kernel-001-run190-algorithm-retention-transfer]
    paths:
      - 'runs/run190/**'
      - '.github/workflows/noesis-run190.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy==2.3.5' 'torch==2.10.0' 'mpmath==1.3.0'
      - name: Train untouched seeds
        run: python runs/run190/train.py
      - name: Independently certify seed 151 at both epochs
        run: python runs/run190/certify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noesis-run190-reproduction
          path: |
            runs/run190/TRAINED.json
            runs/run190/CERTIFICATION.json
