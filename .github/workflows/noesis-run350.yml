name: NOESIS Run 350
on:
  push:
    branches:
      - research/kernel-001-run350-deep-obstruction-prospective
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 torch==2.10.0
      - run: python research/run350/reproduce350.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run350-evidence
          retention-days: 90
          path: research/run350/
