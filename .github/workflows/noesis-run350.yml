name: NOESIS Run350 exact proof
on:
  push:
    branches:
      - research/kernel-001-run350-causal-readout-order
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy
      - run: python research/run350/reproduce.py
      - run: python research/run350/independent_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run350-reproduction
          path: research/run350/reproduction_results.json
