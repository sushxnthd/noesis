name: noesis-run154-smoke
on:
  push:
    branches: [research/kernel-001-run154-cycle-jacobian]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q research/kernel001/run154/test_score.py
