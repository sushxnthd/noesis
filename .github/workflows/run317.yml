name: NOESIS Run317 proof
on:
  push:
    branches: [research/kernel-001-run317-public-repro]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy==1.13.3
      - run: python research/run317/test317.py
