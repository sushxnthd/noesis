name: NOESIS Run287 exact checks and public reproduction
on:
  push:
    branches:
      - research/kernel-001-run287-certified-loss-adversarial-audit
  workflow_dispatch:
jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/kernel_001/run287/exact_transition_20833.py
      - run: python3 research/kernel_001/run287/exact_exhaustive287.py
  reproduce-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Train all 128 new seeds on public runner
        working-directory: research/kernel_001/run286
        run: python train286.py
      - name: Inspect checkpoint count and digest
        working-directory: research/kernel_001/run286
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          b=Path('checkpoints286.json').read_bytes()
          d=json.loads(b)
          assert len(d['rows'])==640
          assert d['config']['seeds']==list(range(20800,20928))
          print('checkpoint_sha256',hashlib.sha256(b).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: noesis-run286-public-checkpoints
          path: research/kernel_001/run286/checkpoints286.json
