name: NOESIS Run246 full replay
on:
  push:
    branches:
      - research/kernel-001-run246-relu-transfer
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU framework
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Reproduce frozen training, exact verification and independent witnesses
        run: |
          cd research/run246
          python train.py
          python verify.py
          python independent_spoof.py
      - name: Check frozen negative criterion
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research/run246/SUMMARY.json'))
          assert d['trained']==48
          assert not d['primary_threshold_pass']
          assert d['known_incorrect_false_positive']==0
          print(d)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noesis-run246-relu-evidence
          path: |
            research/run246/CHECKPOINTS.json
            research/run246/OUTCOMES.json
            research/run246/SUMMARY.json
          retention-days: 30
