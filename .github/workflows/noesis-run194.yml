name: NOESIS Run 194 paired beam replication
on:
  push:
    branches: [research/kernel-001-run194-beam-transfer]
    paths:
      - 'runs/run194/**'
      - '.github/workflows/noesis-run194.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.3.5 torch==2.10.0 mpmath==1.3.0
      - name: Train frozen Run 190 seeds
        run: python runs/run194/train.py
      - name: Run frozen beam and random trials
        run: OPENBLAS_NUM_THREADS=1 python runs/run194/beam.py runs/run194/TRAINED.json
      - name: Validate outputs
        run: python runs/run194/check_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noesis-run194-independent-reproduction
          path: |
            runs/run194/TRAINED.json
            runs/run194/CI_RESULTS.json
