name: NOESIS K001 Run288 held-out reproducibility
on:
  push:
    branches:
      - research/kernel-001-run288-invariant-distance-prospective
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install scipy==1.17.0 sympy==1.14.0 numpy
      - name: Reproduce all 256 gradient-trained trajectories
        working-directory: research/kernel001/run288
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python train288.py
      - name: Freeze early diagnostic scores and verify digest
        working-directory: research/kernel001/run288
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python score288.py
      - name: Evaluate exact held-out certificate endpoints
        working-directory: research/kernel001/run288
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python evaluate288.py
      - name: Independent symbolic verification
        working-directory: research/kernel001/run288
        run: python independent288.py
      - name: Upload complete public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noesis-run288-complete-evidence
          path: |
            research/kernel001/run288/checkpoints288.json
            research/kernel001/run288/optimizer288.pt
            research/kernel001/run288/FROZEN_EARLY_SCORES.json
            research/kernel001/run288/outcomes288.json
          if-no-files-found: warn
