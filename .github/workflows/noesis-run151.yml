name: noesis-run151
on:
  push:
    branches:
      - research/kernel-001-run151-all-alphabet-intervention
  pull_request:
jobs:
  exhaustive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pytest
      - run: OPENBLAS_NUM_THREADS=1 python -m pytest -q tests/test_run151.py
      - run: OPENBLAS_NUM_THREADS=1 python research/kernel_001/run151/global_horizon.py
      - run: OPENBLAS_NUM_THREADS=1 python research/kernel_001/run151/independent_longdouble.py
