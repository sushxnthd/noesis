name: noesis-run206
on:
  push:
    branches: [research/kernel-001-run206-reset-parity-frozen]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 mpmath==1.3.0
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python research/kernel_001/run206/train.py
      - run: python research/kernel_001/run206/certify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run206-evidence
          path: |
            research/kernel_001/run206/CHECKPOINTS.json
            research/kernel_001/run206/RESULTS.json