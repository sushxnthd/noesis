name: noesis-run215-temporal-proof
on:
  push:
    branches:
      - research/kernel-001-run215-temporal-leakage-audit
  workflow_dispatch:
jobs:
  independent-temporal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy mpmath
      - run: python research/kernel001/run215/reverify_epoch100.py
      - run: python research/kernel001/run215/evaluate.py
      - name: Assert frozen criterion
        run: python -c "import json; d=json.load(open('research/kernel001/run215/evaluation_reproduced.json')); assert d['pass'] and d['num_permutations']==495"
