name: NOESIS K001 Run289 gauge reproducibility
on:
  push:
    branches: [research/kernel-001-run289-gauge-evidence]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy==2.4.2 scipy==1.17.0
      - name: Download immutable Run288 evidence
        uses: actions/download-artifact@v4
        with:
          name: noesis-run288-complete-evidence
          run-id: 39382193835
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: sushxnthd/noesis
          path: research/kernel001/run288
      - name: Evaluate frozen gauge and posthoc canonicalization
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python research/kernel001/run289/run289.py
      - name: Independent exact arithmetic verification
        run: python research/kernel001/run289/independent289.py
      - name: Preserve raw and derived results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noesis-run289-results
          path: research/kernel001/run289/results289.json
          if-no-files-found: warn
