name: NOESIS Run348 frozen prospective replication
on:
  push:
    branches:
      - research/kernel-001-run348-prospective-representation
  pull_request:
  workflow_dispatch:
jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.10.0 numpy==2.3.5 scipy==1.17.0 sympy==1.14.0
      - run: python research/run348/train348.py
      - run: python research/run348/verify348.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noesis-run348-raw-trajectories
          path: |
            research/run348/trajectories348.json
            research/run348/training348_summary.json
            research/run348/FROZEN_PROTOCOL.md
          retention-days: 90
