name: noesis-run205-exact
on:
  push:
    branches: [research/kernel-001-run205-gated-parity-prospective]
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mpmath
      - run: cd research/kernel_001/run205 && python verify_repo.py
      - run: cd research/kernel_001/run205 && python verify_repo_independent.py
      - run: cd research/kernel_001/run205 && python spoof205.py
      - run: cd research/kernel_001/run205 && python spoof205_decimal.py
      - run: cd research/kernel_001/run205 && python transition_witness205.py
      - run: cd research/kernel_001/run205 && python -m unittest -q test_run205.py
