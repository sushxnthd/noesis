name: NOESIS Run 346 exact certificate
on:
  push:
    branches:
      - research/kernel-001-run346-long-horizon-readout
  workflow_dispatch:
jobs:
  exact-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact rational certificate
        run: python research/run346/verify346.py
      - name: Independent checker
        run: |
          python -m pip install sympy
          python research/run346/independent346.py
