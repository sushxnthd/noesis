name: NOESIS Run 346 exact certificate
on:
  push:
    branches:
      - research/kernel-001-run346-long-horizon-readout
  workflow_dispatch:
jobs:
  exact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy sympy
      - run: python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python research/run346/verify346.py
      - run: python research/run346/independent346.py
      - run: python research/run342/train342.py
      - run: python research/run346/verify_trajectory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noesis-run346-full-trajectories
          path: research/run342/trajectories342.json
          retention-days: 90
