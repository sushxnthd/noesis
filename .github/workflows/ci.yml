name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy
      - run: python -m pytest -q
      - run: python research/kernel_001/finite_horizon_spoof.py > kernel_001_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-001-results
          path: kernel_001_results.json
