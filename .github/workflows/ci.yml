name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests on this branch yet."
          fi
