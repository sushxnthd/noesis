name: NOESIS Run349 independent exact proof
on:
  push:
    branches: ['research/kernel-001-run349-*']
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy sympy
      - run: python research/run349/wordgen.py
      - run: python research/run349/scan.py
      - run: python research/run349/verify_witness.py
      - run: python research/run349/verify_horizon.py
      - run: python research/run349/verify_one_step.py
